tls:
  # auto     — custom, если есть сертификат в /certs; иначе acme, если задан
  #            acme.email и все домены публичные; иначе local-ca.
  # custom   — свой сертификат (один на все домены: SAN или wildcard).
  # acme     — Let's Encrypt (нужны публичные домены и доступные 80/443).
  # local-ca — собственный CA Guard. Корневой сертификат скачивается по
  #            http://<hostname>/.guard/ca.crt и ставится на устройства.
  mode: auto

  custom:
    # Файлы должны читаться пользователем uid 10001.
    certificate: /certs/fullchain.pem
    private_key: /certs/privkey.pem

  acme:
    email: ""                 # например admin@example.com
    # ca: https://acme-staging-v02.api.letsencrypt.org/directory
    # Если ACME не выдал сертификат за fallback_after — перейти на local-ca.
    # Без явного разрешения Guard никогда не подменяет сертификат молча.
    allow_fallback: false
    fallback_after: 10m
