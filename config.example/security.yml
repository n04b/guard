registration:
  # closed — пользователей создаёт администратор:
  #          docker exec guard guard-sync user add user@example.com
  # open   — самостоятельная регистрация (требует SMTP: пароль задаётся
  #          по ссылке из письма).
  mode: closed
  # allowed_email_domain: example.com   # только для open

password_policy:
  min_length: 12
  max_length: 128
  require_lowercase: 0        # минимальное количество символов класса
  require_uppercase: 0
  require_digits: 0
  require_special: 0
  not_recently_used: 0        # запрет повторять N последних паролей
  valid_days: 0               # срок действия пароля, 0 — бессрочно

session:
  idle_minutes: 60            # выход после бездействия
  max_hours: 720              # максимальная длина сессии

hashing:
  # Argon2id. Пиковая память ≈ memory_mib × max_parallel_hashes.
  memory_mib: 32
  iterations: 3
  parallelism: 2
  max_parallel_hashes: 2

# Создаются в Rauthy, если их нет. Удаление из списка ничего не удаляет.
roles: []
groups: []
