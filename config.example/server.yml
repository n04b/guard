# Основные настройки Guard. Обязателен только этот файл.

server:
  # Домен сервера авторизации. Issuer OIDC: https://<hostname>/auth/v1/
  hostname: auth.example.com
  http_port: 80
  https_port: 443
  # CIDR прокси/балансировщиков перед Guard (например, Cloudflare).
  # Только им разрешено передавать X-Forwarded-For.
  trusted_proxies: []

webauthn:
  # Relying Party ID для Passkeys. По умолчанию = server.hostname.
  # ВНИМАНИЕ: после регистрации первого Passkey не менять — все Passkeys
  # перестанут работать. guard-sync откажется применять изменение без
  # GUARD_ALLOW_RP_ID_CHANGE=i-understand-passkeys-will-break.
  rp_id: auth.example.com
  # Название, которое браузер показывает при создании Passkey.
  rp_name: Guard

admin:
  # E-mail первого администратора. Одноразовый пароль при первом запуске
  # пишется в /data/secrets/bootstrap-admin.txt (в логи не попадает).
  bootstrap_email: admin@example.com
  # Откуда открывается Admin UI Rauthy и подробный /health.
  allow_from:
    - 127.0.0.1/32
    - ::1/128
    # - 100.64.0.0/10     # Tailscale
    # - 192.168.0.0/16    # домашняя сеть
  # Админам обязателен Passkey (по умолчанию true).
  require_passkey: true

smtp:
  # Без SMTP всё работает, кроме писем (восстановление, подтверждение e-mail,
  # открытая регистрация).
  enabled: false
  # host: smtp.example.com
  # port: 587
  # username: guard@example.com
  # # Пароль только из переменной окружения контейнера:
  # password_env: GUARD_SMTP_PASSWORD
  # from: "Guard <guard@example.com>"
  # tls_mode: starttls        # tls | starttls | plain

backup:
  # Автоматический бэкап БД Rauthy, синтаксис cron с секундами:
  # "сек мин час день месяц день_недели год". По умолчанию каждый день в 02:30.
  cron: "0 30 2 * * * *"
  keep_days: 7

logging:
  level: info                 # error | warn | info | debug
